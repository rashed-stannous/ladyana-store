name: Import approved Ladyana cover
on:
  push:
    branches: [ladyana-approved-cover-20261106]
    paths: [.github/workflows/import-approved-ladyana-cover.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download and verify approved artwork
        shell: python
        run: |
          import hashlib, struct, urllib.request, urllib.error, zlib
          from pathlib import Path
          url = 'https://media.canva.com/v2/image-resize/format:PNG/height:887/quality:100/uri:ifs%3A%2F%2FM%2Ff7d594cf-506c-4ea6-95e7-a398144d8f8b/watermark:F/width:1774?csig=AAAAAAAAAAAAAAAAAAAAAMeabRlg9S9ZfKwMB4Oazonl_f5XOrHAQ8dhi27Iv989&exp=1793969750&osig=AAAAAAAAAAAAAAAAAAAAAOp_hXaiPTcY7tJL7WkhIskwvyzrTyti6X3VSpeSMAlX&signer=media-rpc&token=AAIAAU0AJGY3ZDU5NGNmLTUwNmMtNGVhNi05NWU3LWEzOTgxNDRkOGY4YgAAAAABobDt__BgmKyyv0jW312rTuWOK92xT8pVnLk_HwI-c1Q_ryf64g&x-canva-quality=thumbnail'
          headers = {'User-Agent':'Mozilla/5.0','Referer':'https://www.canva.com/','Accept':'image/png,image/*;q=0.9,*/*;q=0.8'}
          try:
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=45) as response:
                  data=response.read(10000001)
          except urllib.error.HTTPError as error:
              print('Full-size media request:',error.code,error.read(500).decode(errors='replace'))
              thumbnail=url.replace('/height:887/','/height:100/').replace('/width:1774?','/width:200?')
              try:
                  with urllib.request.urlopen(urllib.request.Request(thumbnail,headers=headers),timeout=30) as response:
                      print('Original media URL status:',response.status)
              except urllib.error.HTTPError as second:
                  print('Original media URL status:',second.code,second.read(500).decode(errors='replace'))
              raise
          assert len(data)<=10000000 and data[:8]==b'\x89PNG\r\n\x1a\n'
          pos,compressed=8,bytearray()
          while pos<len(data):
              size=struct.unpack('>I',data[pos:pos+4])[0]
              kind=data[pos+4:pos+8]
              body=data[pos+8:pos+8+size]
              if kind==b'IHDR': w,h,depth,colour,comp,filt,interlace=struct.unpack('>IIBBBBB',body)
              elif kind==b'IDAT': compressed.extend(body)
              pos+=12+size
              if kind==b'IEND': break
          assert (w,h)==(1774,887),'Image must retain its full original dimensions'
          assert depth==8 and colour in (2,6) and interlace==0
          channels=3 if colour==2 else 4
          stride=w*channels
          raw=zlib.decompress(compressed)
          assert len(raw)==h*(stride+1)
          previous=bytearray(stride)
          rgb=bytearray()
          for y in range(h):
              offset=y*(stride+1)
              mode=raw[offset]
              row=bytearray(raw[offset+1:offset+1+stride])
              for i in range(stride):
                  a=row[i-channels] if i>=channels else 0
                  b=previous[i]
                  c=previous[i-channels] if i>=channels else 0
                  if mode==0: predictor=0
                  elif mode==1: predictor=a
                  elif mode==2: predictor=b
                  elif mode==3: predictor=(a+b)//2
                  elif mode==4:
                      p=a+b-c
                      pa,pb,pc=abs(p-a),abs(p-b),abs(p-c)
                      predictor=a if pa<=pb and pa<=pc else b if pb<=pc else c
                  else: raise ValueError('Unexpected PNG filter')
                  row[i]=(row[i]+predictor)&255
              if channels==3: rgb.extend(row)
              else:
                  for i in range(0,stride,4):
                      assert row[i+3]==255
                      rgb.extend(row[i:i+3])
              previous=row
          assert hashlib.sha256(rgb).hexdigest()=='c1de39c88669b76f94dfc1c354bb95f65bad97b85875a80a694243c945d5f83c','Pixels differ from approved artwork'
          Path('approved-cover.png').write_bytes(data)
          print('Verified approved artwork pixel-for-pixel at 1774 x 887.')
      - name: Commit cover and responsive presentation to staging branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        shell: python
        run: |
          import base64,json,os,urllib.request
          from pathlib import Path
          repo='rashed-stannous/ladyana-store'
          branch='ladyana-approved-cover-20261106'
          def api(path,data=None,method=None):
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
              request=urllib.request.Request('https://api.github.com/repos/'+repo+path,data=None if data is None else json.dumps(data).encode(),headers=headers,method=method or ('GET' if data is None else 'POST'))
              with urllib.request.urlopen(request,timeout=30) as response:return json.load(response)
          head=api('/git/ref/heads/'+branch)['object']['sha']
          assert head==os.environ['EXPECTED_HEAD'],'Branch moved; refusing concurrent overwrite'
          base_tree=api('/git/commits/'+head)['tree']['sha']
          def read(path):return base64.b64decode(api('/contents/'+path+'?ref='+head)['content']).decode()
          source_path='src/components/generated/LadyanaCompleteShoppingExperience.tsx'
          css_path='src/components/generated/Ladyana.css'
          source=read(source_path)
          old_img='<img src="/photos/ladyana-unmatched-style.webp" alt="Ladyana Unmatched Style — blush slingback heels with bows and gold detailing" width="1836" height="857" fetchPriority="high"/>'
          new_img='<img src="/photos/ladyana-limitless-lifestyle-cover.png" alt="Ladyana — Limitless Lifestyle. Champagne woven clutch and slingback heels, cream satin and burgundy drapery. Contact +880 18 5041 4261; www.ladyanabd.com." width="1774" height="887" fetchPriority="high" loading="eager" decoding="async"/>'
          assert source.count(old_img)==1,'Unexpected hero markup'
          source=source.replace(old_img,new_img,1).replace('aria-label="Ladyana Unmatched Style"','aria-label="Ladyana Limitless Lifestyle"',1).replace('Ladyana — Unmatched Style</h1>','Ladyana — Limitless Lifestyle</h1>',1)
          css=read(css_path)+'\n/* Approved November 2026 cover: show the entire artwork at every viewport. */\n.ladyana .style-campaign{display:block;background:#fff8f1;height:auto;min-height:0;padding:0;overflow:visible}\n.ladyana .style-campaign>img{display:block;width:100%;height:auto;max-height:none;aspect-ratio:1774/887;object-fit:contain;margin:0}\n.ladyana .style-campaign-action{position:static;inset:auto;transform:none;display:flex;justify-content:center;margin:0;padding:16px 20px 24px;background:#fff8f1}\n'
          image=api('/git/blobs',{'content':base64.b64encode(Path('approved-cover.png').read_bytes()).decode(),'encoding':'base64'})['sha']
          entries=[{'path':'public/photos/ladyana-limitless-lifestyle-cover.png','mode':'100644','type':'blob','sha':image},{'path':source_path,'mode':'100644','type':'blob','content':source},{'path':css_path,'mode':'100644','type':'blob','content':css}]
          tree=api('/git/trees',{'base_tree':base_tree,'tree':entries})['sha']
          commit=api('/git/commits',{'message':'Use approved Ladyana Limitless Lifestyle cover without cropping','tree':tree,'parents':[head]})['sha']
          assert api('/git/ref/heads/'+branch)['object']['sha']==head
          api('/git/refs/heads/'+branch,{'sha':commit,'force':False},method='PATCH')
          print('Staged cover update commit:',commit)
