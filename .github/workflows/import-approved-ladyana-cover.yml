name: Import approved Ladyana cover
on:
  push:
    branches: [ladyana-approved-cover-20261106]
    paths: [.github/workflows/import-approved-ladyana-cover.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify and install approved cover on staging branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        shell: python
        run: |
          import base64, hashlib, json, os, urllib.request
          repo = 'rashed-stannous/ladyana-store'
          branch = 'ladyana-approved-cover-20261106'
          def api(path, data=None, method=None):
              headers = {'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'}
              request = urllib.request.Request('https://api.github.com/repos/'+repo+path, data=None if data is None else json.dumps(data).encode(), headers=headers, method=method or ('GET' if data is None else 'POST'))
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          head = api('/git/ref/heads/'+branch)['object']['sha']
          assert head == os.environ['EXPECTED_HEAD'], 'Branch moved; refusing concurrent overwrite'
          base_tree = api('/git/commits/'+head)['tree']['sha']
          def read(path):
              return base64.b64decode(api('/contents/'+path+'?ref='+head)['content']).decode()
          paths = ['.cover-staging/part-'+str(i)+'.b64' for i in range(4)]
          parts = [read(path).strip() for path in paths]
          for i, part in enumerate(parts):
              print('Image part', i, 'length', len(part), 'SHA256', hashlib.sha256(part.encode()).hexdigest())
          image_bytes = base64.b64decode(''.join(parts), validate=True)
          digest = hashlib.sha256(image_bytes).hexdigest()
          print('Approved image bytes:', len(image_bytes), 'SHA256:', digest)
          assert len(image_bytes) == 39879, 'Unexpected image size'
          assert digest == 'b64c99aacdcf06ee5255f03c61d0d68960814d5b13707f3be3756cbd5034a338', 'Image transfer integrity check failed'
          source_path = 'src/components/generated/LadyanaCompleteShoppingExperience.tsx'
          css_path = 'src/components/generated/Ladyana.css'
          source = read(source_path)
          old_img = '<img src="/photos/ladyana-unmatched-style.webp" alt="Ladyana Unmatched Style — blush slingback heels with bows and gold detailing" width="1836" height="857" fetchPriority="high"/>'
          new_img = '<img src="/photos/ladyana-limitless-lifestyle-cover.avif" alt="Ladyana — Limitless Lifestyle. Champagne woven clutch and slingback heels, cream satin and burgundy drapery. Contact +880 18 5041 4261; www.ladyanabd.com." width="1774" height="887" fetchPriority="high" loading="eager" decoding="async"/>'
          assert source.count(old_img) == 1, 'Unexpected homepage hero markup'
          source = source.replace(old_img, new_img, 1).replace('aria-label="Ladyana Unmatched Style"', 'aria-label="Ladyana Limitless Lifestyle"', 1).replace('Ladyana — Unmatched Style</h1>', 'Ladyana — Limitless Lifestyle</h1>', 1)
          css = read(css_path) + '\n/* Approved November 2026 cover: preserve the complete artwork on all screen sizes. */\n.ladyana .style-campaign{display:block;background:#fff8f1;height:auto;min-height:0;padding:0;overflow:visible}\n.ladyana .style-campaign>img{display:block;width:100%;height:auto;max-height:none;aspect-ratio:1774/887;object-fit:contain;margin:0}\n.ladyana .style-campaign-action{position:static;inset:auto;transform:none;display:flex;justify-content:center;margin:0;padding:16px 20px 24px;background:#fff8f1}\n'
          image_sha = api('/git/blobs', {'content': base64.b64encode(image_bytes).decode(), 'encoding': 'base64'})['sha']
          entries = [
              {'path': 'public/photos/ladyana-limitless-lifestyle-cover.avif', 'mode': '100644', 'type': 'blob', 'sha': image_sha},
              {'path': source_path, 'mode': '100644', 'type': 'blob', 'content': source},
              {'path': css_path, 'mode': '100644', 'type': 'blob', 'content': css},
          ]
          entries.extend({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None} for path in paths)
          entries.append({'path': '.github/workflows/import-approved-ladyana-cover.yml', 'mode': '100644', 'type': 'blob', 'sha': None})
          tree = api('/git/trees', {'base_tree': base_tree, 'tree': entries})['sha']
          commit = api('/git/commits', {'message': 'Use approved Ladyana Limitless Lifestyle homepage cover', 'tree': tree, 'parents': [head]})['sha']
          assert api('/git/ref/heads/'+branch)['object']['sha'] == head, 'Branch moved before update'
          api('/git/refs/heads/'+branch, {'sha': commit, 'force': False}, method='PATCH')
          print('Staged cover update commit:', commit)
          print('Temporary upload files removed. Production branch unchanged.')
